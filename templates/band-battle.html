<!doctype html>
<!--
  Band Battle starter, built only from the ready-made blocks in jinglefest-media-kit/11-band-battle/
  (made by `bun band.mjs`): stage background, band cut-out, lockup, fact badges and stickers.
  Copy it to templates/<name>.html, swap the pieces, then render:
    bun shot.mjs templates/<name>.html 1080 1350 out/<name>.jpg
  For a story, set --w/--h to 1080/1920, use backgrounds/stage-story-1080x1920.jpg, and keep the top 220
  and bottom 340 px free of words.
-->
<meta charset="utf-8">
<style>
  @font-face { font-family: Cinzel; src: url(../jinglefest-media-kit/03-fonts/CinzelDecorative-Black.ttf); }
  @font-face { font-family: Anton; src: url(../jinglefest-media-kit/03-fonts/Anton-Regular.ttf); }
  @font-face { font-family: Bricolage; font-weight: 200 800; src: url(../jinglefest-media-kit/03-fonts/BricolageGrotesque-Variable.ttf); }
  :root { --ink: #1b0f12; --cream: #fff3d6; --gold: #ffbf1f; --pink: #ff2e7e; --night: #1a0d3a; --w: 1080px; --h: 1350px; }
  * { box-sizing: border-box; margin: 0; }
  body { width: var(--w); height: var(--h); position: relative; overflow: hidden; font-family: Bricolage; color: var(--ink); background: var(--night); }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .logo { position: absolute; left: 58px; top: 44px; font-family: Cinzel; font-weight: 900; text-transform: uppercase; white-space: nowrap; rotate: -6deg; font-size: 56px; line-height: 1.1;
    color: var(--cream); -webkit-text-stroke: .028em currentColor; paint-order: stroke fill;
    text-shadow: .04em .04em 0 var(--ink), 0 0 .05em #fff, 0 0 .14em var(--gold), 0 0 .36em rgb(255 191 31/.85), 0 0 .8em rgb(255 191 31/.55); }
  .logo i { font-style: normal; font-size: 1.5em; } .logo u { text-decoration: none; font-size: 1.3em; }
  .lockup { position: absolute; left: 30px; top: 140px; width: 480px; }
  .badges { position: absolute; left: 34px; right: 34px; top: 505px; display: flex; gap: 4px; align-items: center; }
  .badges img { height: 104px; }
  .burst { position: absolute; right: 250px; top: 150px; width: 270px; }
  .sticker { position: absolute; width: 130px; }
  .band { position: absolute; left: 0; right: 0; bottom: 70px; width: 100%; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--cream); padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
  .foot .url { font-family: Anton; color: var(--gold); font-size: 38px; }
  .foot .ph { font-weight: 700; font-size: 25px; } .foot .ph b { color: var(--gold); }
  .qr { position: absolute; right: 40px; top: 170px; width: 190px; background: #fff; border: 4px solid var(--ink); border-radius: 14px; padding: 7px; box-shadow: 5px 5px 0 var(--ink); }
  .qr img { display: block; width: 100%; }
</style>

<img class="bg" src="../jinglefest-media-kit/11-band-battle/backgrounds/stage-feed-1080x1350.jpg" alt="">
<span class="logo"><i>J</i>inglefes<u>T</u></span>
<img class="lockup" src="../jinglefest-media-kit/11-band-battle/lockups/band-battle-stacked.png" alt="Band Battle">
<img class="burst" src="../jinglefest-media-kit/11-band-battle/badges/burst-christmas-songs.png" alt="">
<div class="badges">
  <img src="../jinglefest-media-kit/11-band-battle/badges/screening-28-november.png" alt="">
  <img src="../jinglefest-media-kit/11-band-battle/badges/final-6-december.png" alt="">
</div>
<div class="qr"><img src="../jinglefest-media-kit/09-qr-codes/qr-band-battle.svg" alt=""></div>
<img class="band" src="../jinglefest-media-kit/11-band-battle/cutouts/band.png" alt="">
<div class="foot"><span class="url">thejinglefest.com/music</span><span class="ph"><b>Call</b> +91 80988 41307 / +91 9176040644</span></div>
